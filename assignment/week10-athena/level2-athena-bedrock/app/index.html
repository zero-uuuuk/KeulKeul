<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEULFLIX</title>
<style>
  :root {
    --bg: #141414;
    --panel: #181818;
    --line: #2f2f2f;
    --text: #ffffff;
    --muted: #a3a3a3;
    --red: #e50914;
    --red-hover: #f6121d;
    --green: #46d369;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Helvetica Neue", Helvetica, Arial, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* 상단 바 */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 24px;
    padding: 16px 4vw;
    background: linear-gradient(180deg, rgba(0,0,0,.95) 10%, rgba(0,0,0,0));
  }
  .logo {
    font-size: 26px; font-weight: 900; letter-spacing: -1.4px;
    color: var(--red); text-transform: uppercase;
  }
  .nav { color: var(--muted); font-size: 13px; letter-spacing: .4px; }
  .counter { margin-left: auto; text-align: right; }
  .counter b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .counter span { font-size: 11px; color: var(--muted); letter-spacing: 1.2px; text-transform: uppercase; }

  /* 히어로 */
  .hero {
    padding: 40px 4vw 32px;
    background:
      radial-gradient(120% 90% at 15% 0%, rgba(229,9,20,.28), transparent 60%),
      linear-gradient(180deg, #1b1b1b, var(--bg));
    border-bottom: 1px solid var(--line);
  }
  .hero h1 { margin: 0 0 12px; font-size: clamp(26px, 4vw, 42px); font-weight: 800; letter-spacing: -1px; }
  .hero p { margin: 0 0 22px; max-width: 620px; color: #d2d2d2; font-size: 14px; }
  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 11px 26px; border: 0; border-radius: 4px;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .btn-primary { background: var(--red); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--red-hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .toast { color: #ff6b6b; font-size: 13px; }

  /* 작품 행 */
  section { padding: 30px 4vw; }
  h2 { margin: 0 0 14px; font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
  .row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 10px; overflow-x: auto; padding: 8px 0 18px; }
  .row::-webkit-scrollbar { height: 6px; }
  .row::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }

  .poster {
    position: relative; aspect-ratio: 2/3;
    border: 0; border-radius: 4px; padding: 12px;
    display: flex; flex-direction: column; justify-content: flex-end;
    text-align: left; color: #fff; font: inherit; cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .poster::after {
    content: ""; position: absolute; inset: 0; border-radius: 4px;
    background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.85));
  }
  .poster:hover { transform: scale(1.07); box-shadow: 0 10px 28px rgba(0,0,0,.7); z-index: 2; }
  .poster:active { transform: scale(1.01); }
  .poster b, .poster small, .poster .play { position: relative; z-index: 1; }
  .poster b { font-size: 15px; font-weight: 700; line-height: 1.25; }
  .poster small { color: #c8c8c8; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .poster .play {
    position: absolute; top: 12px; right: 12px;
    width: 30px; height: 30px; border-radius: 50%;
    background: rgba(20,20,20,.75); border: 1.5px solid #fff;
    display: grid; place-items: center; font-size: 11px;
    opacity: 0; transition: opacity .2s;
  }
  .poster:hover .play { opacity: 1; }

  /* 장르별 포스터 배경 */
  .g-sf         { background: linear-gradient(150deg, #1e3a8a, #4c1d95); }
  .g-thriller   { background: linear-gradient(150deg, #450a0a, #1c1917); }
  .g-action     { background: linear-gradient(150deg, #9a3412, #b91c1c); }
  .g-romance    { background: linear-gradient(150deg, #9d174d, #7e22ce); }
  .g-documentary{ background: linear-gradient(150deg, #065f46, #0e7490); }
  .g-comedy     { background: linear-gradient(150deg, #a16207, #ea580c); }
  .g-drama      { background: linear-gradient(150deg, #312e81, #1e293b); }
  .g-mystery    { background: linear-gradient(150deg, #14532d, #334155); }

  /* 진행 상태 */
  .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; list-style: none; padding: 0; margin: 0; }
  .steps li { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  .steps .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .steps .num { color: var(--muted); font-size: 11px; letter-spacing: 1.5px; }
  .steps .label { font-weight: 700; font-size: 14px; margin-top: 4px; }
  .state { font-size: 11px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .state.running { border-color: var(--red); color: #ff6b73; }
  .state.succeeded { border-color: var(--green); color: var(--green); }
  .state.failed { border-color: #ff4d4f; color: #ff4d4f; background: rgba(255,77,79,.1); }
  .detail { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.6; word-break: break-all; }
  .detail.error { color: #ff8a8a; }

  /* 리포트 */
  .report { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 26px 22px; max-width: 820px; }
  .report h3 { font-size: 15px; margin: 22px 0 8px; color: #fff; }
  .report p, .report li { color: #cfcfcf; font-size: 14px; }
  .report li { margin-left: 4px; }
  .report .total { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<header>
  <div class="logo">Keulflix</div>
  <div class="nav">시청 로그 분석 콘솔</div>
  <div class="counter">
    <b id="count">0</b>
    <span>기록된 이벤트</span>
  </div>
</header>

<div class="hero">
  <h1>지금 시청 중인 데이터</h1>
  <p>작품을 선택해 시청 이벤트를 쌓고, 분석 실행으로 S3 업로드부터 Athena 집계와 AI 리포트까지 실행한다.</p>
  <div class="actions">
    <button class="btn btn-primary" id="run">▶ 분석 실행</button>
    <span class="toast" id="toast"></span>
  </div>
</div>

<section>
  <h2>지금 뜨는 콘텐츠</h2>
  <div class="row" id="cards"></div>
</section>

<section>
  <h2>분석 진행 상태</h2>
  <ol class="steps" id="steps"><li><span class="empty">분석 실행 버튼을 누르면 단계가 표시된다.</span></li></ol>
</section>

<section id="reportWrap" hidden>
  <h2>AI 분석 리포트</h2>
  <div class="report" id="report"></div>
</section>

<script>
const $ = (id) => document.getElementById(id);
let pollTimer = null;

// 서버가 내려준 작품 목록으로 포스터를 만든다. 목록의 출처를 서버 한 곳으로 유지한다.
async function loadCatalog() {
  const { catalog, devices } = await (await fetch("/api/catalog")).json();
  $("cards").innerHTML = "";
  for (const work of catalog) {
    const card = document.createElement("button");
    card.className = `poster g-${work.genre}`;
    card.innerHTML = `<span class="play">▶</span><small></small><b></b>`;
    card.querySelector("small").textContent = work.genre;
    card.querySelector("b").textContent = work.title;
    card.onclick = () => watch(work.title, devices);
    $("cards").append(card);
  }
}

// 포스터를 누르면 source=user 이벤트를 한 건 기록한다.
async function watch(title, devices) {
  const body = {
    title,
    device: devices[Math.floor(Math.random() * devices.length)],
    watch_minutes: 5 + Math.floor(Math.random() * 116),
    viewer_id: "viewer-web",
    source: "user",
  };
  const response = await fetch("/api/watch", { method: "POST", body: JSON.stringify(body) });
  const data = await response.json();
  if (!response.ok) return showToast(data.error);
  setCount(data.event_count);
}

async function refreshCount() {
  const { event_count } = await (await fetch("/api/stats")).json();
  setCount(event_count);
}

function setCount(value) {
  $("count").textContent = value.toLocaleString();
}

function showToast(message) {
  $("toast").textContent = message || "";
}

// 분석 작업을 시작하고 1초 간격 폴링으로 단계 상태를 갱신한다.
async function startAnalysis() {
  showToast("");
  $("run").disabled = true;
  const response = await fetch("/api/analysis", { method: "POST", body: "{}" });
  const state = await response.json();
  if (!response.ok) {
    $("run").disabled = false;
    return showToast(state.error);
  }
  render(state);
  clearInterval(pollTimer);
  pollTimer = setInterval(() => poll(state.job_id), 1000);
}

async function poll(jobId) {
  const state = await (await fetch(`/api/analysis/${jobId}`)).json();
  render(state);
  if (state.status !== "running") {
    clearInterval(pollTimer);
    $("run").disabled = false;
  }
}

const STATE_LABEL = { pending: "대기", running: "진행 중", succeeded: "성공", failed: "실패" };

function render(state) {
  $("steps").innerHTML = "";
  state.steps.forEach((step, index) => {
    const item = document.createElement("li");
    item.innerHTML = `<div class="head"><span class="num"></span><span class="state"></span></div><div class="label"></div>`;
    item.querySelector(".num").textContent = `STEP ${index + 1}`;
    item.querySelector(".label").textContent = step.label;
    const badge = item.querySelector(".state");
    badge.textContent = STATE_LABEL[step.state];
    badge.classList.add(step.state);

    // 실패한 단계는 오류 메시지를, 성공한 단계는 서버가 남긴 중간 결과를 보여준다.
    const text = step.error || Object.entries(step.detail).map(([k, v]) => `${k}: ${v}`).join("\n");
    if (text) {
      const detail = document.createElement("div");
      detail.className = step.error ? "detail error" : "detail";
      detail.textContent = text;
      item.append(detail);
    }
    $("steps").append(item);
  });

  if (state.report) {
    $("reportWrap").hidden = false;
    $("report").innerHTML = "";
    // Model이 Markdown으로 답하므로 제목·목록·문단만 최소한으로 변환해 표시한다.
    for (const line of state.report.split("\n")) {
      const text = line.trim();
      if (!text) continue;
      const tag = text.startsWith("#") ? "h3" : /^[-*]\s/.test(text) ? "li" : "p";
      const node = document.createElement(tag);
      node.textContent = text.replace(/^#+\s*/, "").replace(/^[-*]\s*/, "").replace(/\*\*/g, "");
      $("report").append(node);
    }
    const total = document.createElement("div");
    total.className = "total";
    total.textContent = `분석에 사용한 전체 이벤트 수: ${state.event_count.toLocaleString()}건`;
    $("report").append(total);
  }
}

$("run").onclick = startAnalysis;
loadCatalog().then(refreshCount);
setInterval(refreshCount, 3000);
</script>
</body>
</html>
